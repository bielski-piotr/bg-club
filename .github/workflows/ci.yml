name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typy, lint, testy jednostkowe, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bg-club/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno check create-member/index.ts
      - run: deno test

  sql:
    name: Baza i Auth (pgTAP, integracja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres, Auth, PostgREST, Edge Functions i bramka API: tyle potrzebują migracje, pgTAP
      # i testy integracyjne (`pnpm test:auth`, w tym `create-member`). Pozostałe usługi pełnego
      # stosu (`pnpm db:start`) są pominięte.
      - run: >-
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - run: pnpm test:sql
      - run: pnpm db:lint
      # Bootstrap administratora i logowanie hookiem na świeżej instalacji.
      - run: pnpm test:auth
      # Reset do pustej bazy i ponowne uruchomienie instalacji też muszą przechodzić testy.
      - run: pnpm db:reset
      - run: pnpm test:sql
      - run: pnpm test:auth
