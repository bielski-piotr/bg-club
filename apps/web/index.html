<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1220" media="(prefers-color-scheme: dark)" />
    <!-- Połączenie z Supabase (DNS, TLS) zestawiane równolegle z pobieraniem pakietu (NFR-2). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BG Club" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BG Club</title>
    <script>
      // Motyw przed pierwszym renderem (bez mignięcia). Klucz: src/theme/theme.ts.
      try {
        var theme = localStorage.getItem('bg-club.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
